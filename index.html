<head>
  <meta charset="utf-8">

  <title>Bitácora personal · Acceso</title>
  <style>
    :root { font-family: Gotham,"Century Gothic",Arial,sans-serif; color: #191919; background: #f5f4f1; --rojo: #f40000; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    [hidden] { display: none !important; }
    .portada { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: clamp(18px,5vw,72px); }
    .cuaderno { display: grid; grid-template-columns: 1fr 1fr; width: min(960px,100%); background: white; border: 1px solid #dedbd6; border-radius: 5px; box-shadow: 0 18px 68px #251b1010; overflow: hidden; }
    .tapa { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 80px; min-height: 470px; padding: clamp(28px,4vw,56px); background: var(--rojo); color: white; }
    .marca { width: 34px; height: 36px; border: 2px solid currentColor; border-radius: 3px 6px 5px 3px; position: relative; }
    .marca::before { content: ""; position: absolute; inset: 0 auto 0 6px; border-left: 2px solid currentColor; }
    .marca::after { content: ""; position: absolute; width: 12px; height: 5px; top: 8px; right: 4px; border-block: 2px solid currentColor; }
    .tapa::after { content: ""; position: absolute; z-index: -1; width: 75%; aspect-ratio: 1; border: 1px solid #ffffff50; border-radius: 50%; top: -18%; right: -40%; box-shadow: 0 0 0 18px #f40000,0 0 0 19px #ffffff50,0 0 0 38px #f40000,0 0 0 39px #ffffff50,0 0 0 58px #f40000,0 0 0 59px #ffffff50; }
    h1 { margin: 0; font-size: clamp(2.5rem,5vw,4.6rem); line-height: .99; letter-spacing: -.068em; text-transform: uppercase; overflow-wrap: break-word; }
    .entrada { display: flex; flex-direction: column; justify-content: center; padding: clamp(28px,5vw,66px); }
    h2 { font-size: clamp(1.5rem,2.75vw,2.2rem); letter-spacing: -.05em; line-height: 1.12; margin: 0; }
    .instruccion { font-size: 1rem; line-height: 1.55; color: #52504b; margin: .9rem 0 2rem; }
    label { display: block; font-size: .88rem; font-weight: 700; margin-bottom: .5rem; }
    .campo { display: flex; border: 1px solid #79756f; border-radius: 4px; overflow: hidden; background: white; }
    .campo:focus-within { outline: 2px solid #171717; outline-offset: 2px; }
    input,button { font: inherit; }
    input { flex: 1; min-width: 0; border: none; padding: .85rem; color: inherit; }
    input:focus { outline: none; }
    button { cursor: pointer; border: none; font-weight: 700; }
    button:focus-visible { outline: 3px solid #121212; outline-offset: 3px; }
    button:disabled { cursor: default; opacity: .6; }
    .ver { background: white; color: #363330; padding: 0 .8rem; font-size: .8rem; }
    .ver:focus-visible { outline-offset: -3px; }
    .entrar { width: 100%; margin-top: 1rem; display: flex; justify-content: space-between; align-items: center; color: white; background: #191919; padding: .95rem 1.15rem; border-radius: 4px; }
    .entrar:hover:not(:disabled),.cerrar:hover { background: #393939; }
    #estado { color: #853200; font-size: .9rem; font-weight: 600; line-height: 1.5; margin: 1rem 0 0; }
    #estado:empty { margin: 0; }
    .lector { height: 100vh; height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
    .barra { display: flex; align-items: center; justify-content: flex-end; padding: .35rem clamp(.75rem,3vw,2.5rem); background: #191919; }
    .cerrar { background: #222; color: #fff; border: 1px solid #696969; border-radius: 4px; padding: .5rem .85rem; font-size: .85rem; }
    .cerrar:focus-visible { outline-color: #fff; outline-offset: 1px; }
    #vista,iframe { width: 100%; height: 100%; min-height: 0; border: 0; display: block; background: white; }
    @media (max-width: 680px) {
      .cuaderno { grid-template-columns: 1fr; max-width: 470px; }
      .tapa { min-height: auto; gap: 2rem; }
      .tapa h1 { font-size: clamp(2.3rem,8.5vw,3.7rem); }
      .entrada { padding-block: 2.2rem; }
    }
  </style>
</head>
<body>
  <main id="portada" class="portada">
    <div class="cuaderno">
      <header class="tapa">
        <span class="marca" aria-hidden="true"></span>
        <h1>Bitácora<br>personal</h1>
      </header>
      <section class="entrada" aria-labelledby="titulo">
        <h2 id="titulo">Abrir mi bitácora</h2>
        <p class="instruccion" id="instruccion">Escribe la contraseña que recibiste en Telegram al publicar esta edición.</p>
        <form id="acceso">
          <label for="clave">Contraseña de la edición</label>
          <div class="campo">
            <input id="clave" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required aria-describedby="instruccion estado">
            <button id="ver" class="ver" type="button" aria-controls="clave" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
          </div>
          <button id="entrar" class="entrar" type="submit">Abrir bitácora <span aria-hidden="true">→</span></button>
        </form>
        <p id="estado" role="status" aria-live="polite"></p>
        <noscript>Activa JavaScript para descifrar tu bitácora en este navegador.</noscript>
      </section>
    </div>
  </main>
  <section id="lector" class="lector" aria-label="Bitácora abierta" hidden>
    <div class="barra"><button id="cerrar" class="cerrar" type="button">Cerrar bitácora</button></div>
    <div id="vista"></div>
  </section>

  <script>
    (() => {
      "use strict";
      const porId = id => document.getElementById(id);
      const clave = porId("clave");
      const ver = porId("ver");
      const entrar = porId("entrar");
      const estado = porId("estado");
      const limite = 5;
      const registro = "bitacora.intentos:" + location.pathname;
      let bloqueado = false;
      let ocupado = false;
      let fallos = 0;
      let solicitud = 0;
      let sobre;

      function controles() {
        clave.disabled = ver.disabled = entrar.disabled = ocupado || bloqueado;
      }

      function bloquear(texto) {
        bloqueado = true;
        estado.textContent = texto;
        controles();
      }

      function anotarIntentos(cantidad) {
        try {
          sessionStorage.setItem(registro, String(cantidad));
          fallos = cantidad;
          return true;
        } catch {
          bloquear("Permite el almacenamiento de sesión para abrir esta bitácora.");
          return false;
        }
      }

      function revisarLimite() {
        if (fallos >= limite) bloquear("Has agotado los cinco intentos. Esta pestaña quedó bloqueada.");
      }

      function ocultarClave() {
        clave.type = "password";
        ver.textContent = "Mostrar";
        ver.setAttribute("aria-pressed", "false");
      }

      function cerrar() {
        solicitud++;
        porId("vista").replaceChildren();
        porId("lector").hidden = true;
        porId("portada").hidden = false;
        clave.value = "";
        ocultarClave();
        ocupado = false;
        controles();
        revisarLimite();
      }

      function bytes64(texto) {
        if (Uint8Array.fromBase64) return Uint8Array.fromBase64(texto);
        const binario = atob(texto);
        const bytes = new Uint8Array(binario.length);
        for (let i = 0; i < binario.length; i++) bytes[i] = binario.charCodeAt(i);
        return bytes;
      }

      async function descifrar(secreto) {
        let material;
        try {
          material = await crypto.subtle.importKey("raw", secreto, "PBKDF2", false, ["deriveKey"]);
        } finally {
          secreto.fill(0);
        }
        const llave = await crypto.subtle.deriveKey({
          name: "PBKDF2", hash: "SHA-256", salt: bytes64(sobre.sal), iterations: sobre.iteraciones
        }, material, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
        const claro = await crypto.subtle.decrypt({
          name: "AES-GCM", iv: bytes64(sobre.iv), tagLength: 128
        }, llave, bytes64(sobre.datos));
        const bytes = new Uint8Array(claro);
        try {
          return new TextDecoder("utf-8", {fatal: true}).decode(bytes);
        } finally {
          bytes.fill(0);
        }
      }

      ver.addEventListener("click", () => {
        if (clave.type === "text") ocultarClave();
        else {
          clave.type = "text";
          ver.textContent = "Ocultar";
          ver.setAttribute("aria-pressed", "true");
        }
      });

      porId("acceso").addEventListener("submit", async evento => {
        evento.preventDefault();
        if (bloqueado || ocupado || !clave.value) return;
        if (!anotarIntentos(fallos + 1)) return;
        const turno = ++solicitud;
        const secreto = new TextEncoder().encode(clave.value);
        clave.value = "";
        ocultarClave();
        ocupado = true;
        controles();
        estado.textContent = "Abriendo tu bitácora…";
        try {
          const documento = await descifrar(secreto);
          if (turno !== solicitud || !anotarIntentos(0)) return;
          const marco = document.createElement("iframe");
          marco.setAttribute("sandbox", "allow-scripts");
          marco.title = "Panel de actividades y registros personales";
          marco.srcdoc = documento;
          porId("vista").replaceChildren(marco);
          porId("portada").hidden = true;
          porId("lector").hidden = false;
          estado.textContent = "";
          porId("cerrar").focus();
        } catch {
          if (turno !== solicitud) return;
          const restantes = limite - fallos;
          estado.textContent = "Contraseña incorrecta o edición dañada. " +
            (restantes === 1 ? "Queda un intento." : "Quedan " + restantes + " intentos.");
          revisarLimite();
        } finally {
          if (turno === solicitud) {
            ocupado = false;
            controles();
            if (!bloqueado && !porId("portada").hidden) clave.focus();
          }
        }
      });

      porId("cerrar").addEventListener("click", () => {
        cerrar();
        clave.focus();
      });
      window.addEventListener("pagehide", cerrar);
      try {
        const guardado = sessionStorage.getItem(registro);
        const anteriores = guardado === null ? 0 : Number(guardado);
        anotarIntentos(Number.isSafeInteger(anteriores) && anteriores >= 0 ? anteriores : limite);
        revisarLimite();
      } catch {
        bloquear("Permite el almacenamiento de sesión para abrir esta bitácora.");
      }
      try {
        sobre = JSON.parse(porId("sobre").textContent);
        if (!sobre.datos || !sobre.iv || !sobre.sal || !Number.isSafeInteger(sobre.iteraciones) || sobre.iteraciones <= 0) throw Error();
      } catch {
        bloquear("Esta copia está incompleta. Usa el enlace de la última publicación en Telegram.");
      }
      if (!window.crypto?.subtle) bloquear("Abre el enlace HTTPS en un navegador compatible con Web Crypto.");
    })();
  </script>
